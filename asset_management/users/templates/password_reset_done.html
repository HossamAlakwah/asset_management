{% extends "base.html" %}

{% block title %}Password Reset Sent{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-11 col-sm-8 col-md-6 col-lg-5 col-xl-4"   style="width: 5000px;">
        <div class="card shadow-sm border-0 rounded-4">
            <div class="card-header bg-white border-0 text-center py-4">
                <h3 class="fw-bold mb-0">Password Reset Sent</h3>
            </div>
            <div class="card-body p-4">
                <p class="fs-5 text-center text-secondary">
                    We've emailed you instructions for setting your password. If they haven't arrived in a few minutes, please check your spam folder.
                </p>
            </div>
        </div>
    </div>
</div>

<style>
    /* Responsive vertical margin */
    @media (max-width: 576px) {
        .card {
            margin-top: 2.5rem !important;
        }
    }
</style>
{% endblock %}

{% extends "base.html" %}
{% block title %}Choose a new password{% endblock %}
{% block content %}
<form method="post" class="auth-form">
    {% csrf_token %}
    {{ form.non_field_errors }}
    <label>
        New password
        {{ form.new_password1 }}
    </label>
    {{ form.new_password1.errors }}
    <label>
        Confirm password
        {{ form.new_password2 }}
    </label>
    {{ form.new_password2.errors }}
    <button class="primary" type="submit">Save password</button>
</form>
{% endblock %}

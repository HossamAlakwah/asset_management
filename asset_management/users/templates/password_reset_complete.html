{% extends "base.html" %}

{% block title %}Password Reset Complete{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-11 col-sm-8 col-md-6 col-lg-5 col-xl-4" style="width: 5000px;">
        <div class="card shadow-sm border-0 rounded-4">
            <div class="card-header bg-white border-0 text-center py-4">
                <h3 class="fw-bold mb-0">Password Reset Complete</h3>
            </div>
            <div class="card-body p-4 text-center">
                <p class="fs-5 text-secondary mb-4">
                    Your password has been set. You may go ahead and log in now.
                </p>
                <a href="{% url 'login' %}" class="btn btn-primary btn-lg px-5 rounded-3 shadow-sm w-100">
                    Log in
                </a>
            </div>
        </div>
    </div>
</div>

<style>
    /* Responsive vertical margin */
    @media (max-width: 576px) {
        .card {
            margin-top: 2.5rem !important;
        }
    }
</style>
{% endblock %}

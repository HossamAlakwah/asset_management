{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% if object %}Edit{% else %}Add{% endif %} Notification Rule</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="{% static 'css/style.css' %}" />
    <link rel="stylesheet" href="https://site-assets.fontawesome.com/releases/v6.7.2/css/all.css">
    <style>


        .header {
            padding: 2rem 1.5rem 1rem;
            text-align: center;
        }

        .head-office-title {
            font-size: 2.4rem;
            font-weight: 700;
            color: white;
            text-shadow: 0 0 6px rgba(0, 0, 0, 0.9);
        }

        .branch-container {
            max-width: 600px;
            margin: 2rem auto 4rem;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border-radius: var(--border-radius, 12px);
            padding: 30px 25px;
            box-shadow: var(--box-shadow, 0 8px 32px 0 rgba(31, 38, 135, 0.37));
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        form.form-card {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        form.form-card p {
            margin: 0;
            color: white;
            font-weight: 500;
        }

        /* Style form fields */
        form.form-card input[type="text"],
        form.form-card input[type="email"],
        form.form-card select,
        form.form-card textarea {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 8px;
            padding: 12px 15px;
            color: white;
            font-size: 1rem;
            transition: border-color 0.3s ease;
            width: 100%;
        }

        form.form-card input[type="text"]:focus,
        form.form-card input[type="email"]:focus,
        form.form-card select:focus,
        form.form-card textarea:focus {
            border-color: var(--primary-color, #4361ee);
            outline: none;
            background: rgba(255, 255, 255, 0.25);
        }

        /* Save button */
        button.equipment-btn {
            background-color: var(--primary-color, #4361ee);
            border: none;
            padding: 12px 20px;
            font-size: 1.1rem;
            font-weight: 700;
            color: white;
            border-radius: 30px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: background-color 0.3s ease, transform 0.3s ease;
        }

        button.equipment-btn:hover {
            background-color: var(--accent-color, #fca311);
            transform: translateY(-3px);
            box-shadow: 0 8px 16px rgba(252, 163, 17, 0.5);
        }

        /* Back button */
        .back-btn {
            margin-top: 1.5rem;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: white;
            font-weight: 600;
            text-decoration: none;
            background: rgba(255, 255, 255, 0.1);
            padding: 10px 18px;
            border-radius: 25px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(5px);
            transition: background-color 0.3s ease, transform 0.3s ease;
        }

        .back-btn:hover {
            background-color: var(--primary-color, #4361ee);
            text-decoration: none;
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(67, 97, 238, 0.5);
        }

        /* Footer styling consistent with dashboard */
        .footer {
            text-align: center;
            padding: 1.5rem 1rem;
            color: #bbb;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            font-size: 0.9rem;
            background: transparent;
            position: relative;
            z-index: 10;
        }

        .footer strong {
            color: white;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1 class="head-office-title">
            {% if object %}Edit{% else %}Add{% endif %} Notification Rule
        </h1>
    </div>

    <div class="branch-container card-container">
        <form method="post" class="form-card">
            {% csrf_token %}
            {{ form.as_p }}

            <button type="submit" class="equipment-btn">
                <i class="fas fa-save"></i> Save
            </button>
        </form>

        <a href="{% url 'notification_dashboard' %}" class="back-btn">
            <i class="fas fa-arrow-left"></i> Back to Notification Rules
        </a>
    </div>

    <div class="footer">
        <p>Asset Management System &copy; 2025 | All rights reserved</p>
        <p><strong>Powered by Hossam Alakwah</strong></p>
    </div>
</body>
</html>

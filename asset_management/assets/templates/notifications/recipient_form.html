{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% if object %}Edit{% else %}Add{% endif %} Recipient</title>
    <link rel="stylesheet" href="{% static 'css/branches.css' %}">
    <link rel="stylesheet" href="https://site-assets.fontawesome.com/releases/v6.7.2/css/all.css">
</head>
    <style>


        .header {
            padding: 2rem 1.5rem 1rem;
            text-align: center;
        }

        .head-office-title {
            font-size: 2.4rem;
            font-weight: 700;
            color: white;
            text-shadow: 0 0 6px rgba(0, 0, 0, 0.9);
        }

        .branch-container {
            max-width: 600px;
            margin: 2rem auto 4rem;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border-radius: var(--border-radius, 12px);
            padding: 30px 25px;
            box-shadow: var(--box-shadow, 0 8px 32px 0 rgba(31, 38, 135, 0.37));
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        form.form-card {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        form.form-card p {
            margin: 0;
            color: white;
            font-weight: 500;
        }

        /* Style form fields */
        form.form-card input[type="text"],
        form.form-card input[type="email"],
        form.form-card select,
        form.form-card textarea {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 8px;
            padding: 12px 15px;
            color: white;
            font-size: 1rem;
            transition: border-color 0.3s ease;
            width: 100%;
        }

        form.form-card input[type="text"]:focus,
        form.form-card input[type="email"]:focus,
        form.form-card select:focus,
        form.form-card textarea:focus {
            border-color: var(--primary-color, #4361ee);
            outline: none;
            background: rgba(255, 255, 255, 0.25);
        }

        /* Save button */
        button.equipment-btn {
            background-color: var(--primary-color, #4361ee);
            border: none;
            padding: 12px 20px;
            font-size: 1.1rem;
            font-weight: 700;
            color: white;
            border-radius: 30px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: background-color 0.3s ease, transform 0.3s ease;
        }

        button.equipment-btn:hover {
            background-color: var(--accent-color, #fca311);
            transform: translateY(-3px);
            box-shadow: 0 8px 16px rgba(252, 163, 17, 0.5);
        }

        /* Back button */
        .back-btn {
            margin-top: 1.5rem;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: white;
            font-weight: 600;
            text-decoration: none;
            background: rgba(255, 255, 255, 0.1);
            padding: 10px 18px;
            border-radius: 25px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(5px);
            transition: background-color 0.3s ease, transform 0.3s ease;
        }

        .back-btn:hover {
            background-color: var(--primary-color, #4361ee);
            text-decoration: none;
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(67, 97, 238, 0.5);
        }

        /* Footer styling consistent with dashboard */
        .footer {
            text-align: center;
            padding: 1.5rem 1rem;
            color: #bbb;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            font-size: 0.9rem;
            background: transparent;
            position: relative;
            z-index: 10;
        }

        .footer strong {
            color: white;
        }
        /* Highlight the select for chosen model to notify */
form.form-card select.model-select {
    background: rgba(255, 255, 255, 0.2);
    border: 2px solid rgba(255, 255, 255, 0.4);
    padding-right: 40px; /* space for custom arrow */
    font-weight: 600;
    color: #fff;
    transition: border-color 0.3s ease, background-color 0.3s ease;
    position: relative;
    appearance: none;
    -webkit-appearance: none;
    -moz-appearance: none;
    border-radius: 10px;
    cursor: pointer;
}

/* On focus and when active */
form.form-card select.model-select:focus {
    border-color: var(--primary-color, #4361ee);
    background: rgba(255, 255, 255, 0.35);
    outline: none;
    box-shadow: 0 0 10px var(--primary-color, #4361ee);
}

/* Custom arrow icon */
form.form-card select.model-select::-ms-expand {
    display: none; /* hide default arrow in IE */
}

form.form-card select.model-select::after {
    content: "\f078"; /* FontAwesome down chevron */
    font-family: "Font Awesome 6 Free";
    font-weight: 900;
    position: absolute;
    right: 15px;
    top: 50%;
    pointer-events: none;
    transform: translateY(-50%);
    color: #eee;
    font-size: 1rem;
}

/* Fallback for custom arrow with a pseudo element */
form.form-card select.model-select {
    background-image: url("data:image/svg+xml;charset=US-ASCII,%3csvg%20width%3d%2212%22%20height%3d%227%22%20viewBox%3d%220%200%2012%207%22%20xmlns%3d%22http%3a//www.w3.org/2000/svg%22%3e%3cpolygon%20points%3d%220%200%206%207%2012%200%22%20fill%3d%22white%22/%3e%3c/svg%3e");
    background-repeat: no-repeat;
    background-position: right 15px center;
    background-size: 12px 7px;
}

/* Color for selected option text (not widely supported but some browsers) */
form.form-card select.model-select option:checked {
    font-weight: 700;
    color: var(--primary-color, #4361ee);
}
    </style>
<body>
    <div class="header">
        <h1 class="head-office-title">
            {% if object %}Edit{% else %}Add{% endif %} Notification Recipient
        </h1>
    </div>

    <div class="branch-container card-container">
        <form method="post" class="form-card">
            {% csrf_token %}
            {{ form.as_p }}

            <button type="submit" class="equipment-btn">
                <i class="fas fa-save"></i> Save
            </button>
        </form>

        <a href="{% url 'notification_dashboard' %}" class="back-btn">
            <i class="fas fa-arrow-left"></i> Back 
        </a>
    </div>

    <div class="footer">
        <p>Asset Management System &copy; 2025 | All rights reserved</p>
        <p><strong>Powered by Hossam Alakwah</strong></p>
    </div>
</body>
</html>

{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Add New Access Point</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="{% static 'css/style.css' %}" />
<style>
        .asset-detail-container {
            max-width: 1000px;
            margin: 40px auto;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.1);
            border-radius: var(--border-radius);
            padding: 25px 35px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
            backdrop-filter: blur(12px);
        }
        .asset-header-details {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }
        .asset-header-details h2 {
            font-size: 1.8rem;
            color: #fff;
        }
        .asset-form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
        }
        .form-group label {
            font-weight: 600;
            color: rgba(255, 255, 255, 0.9);
            margin-bottom: 6px;
        }
        .form-group input,
        .form-group select {
            padding: 10px;
            color: #fff;
            border-radius: 6px;
            font-size: 14px;
            background-color: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            outline: none;
        }
        .form-group input:focus,
        .form-group select:focus {
            border: 1px solid #70a1ff;
            background-color: rgba(255, 255, 255, 0.15);
        }
        .form-error {
            color: #ff6b6b;
            font-size: 13px;
            margin-top: 4px;
        }
        .form-actions {
            text-align: center;
            margin-top: 30px;
        }
        .form-actions .btn {
            padding: 10px 25px;
            font-size: 16px;
            margin: 0 10px;
        }
        .header-back-btn {
            color: white;
            text-decoration: none;
            background: rgba(255, 255, 255, 0.1);
            padding: 8px 15px;
            border-radius: 20px;
            transition: 0.2s;
        }
        .header-back-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }
        body {
            background: linear-gradient(135deg, #2f3542, #3742fa);
            font-family: 'Segoe UI', sans-serif;
        }
    </style>
</head>

<body>
<div class="container asset-detail-container">
    <div class="glass-card card-accent-top">
        <div class="asset-header-details">
            <h2><i class="fas fa-plus-circle"></i> Add New Access Point</h2>
            <a href="{% url 'all_access_points' %}" class="header-back-btn">
                <i class="fas fa-arrow-left"></i> Back
            </a>
        </div>

        {% if messages %}
            <div class="flash-messages">
                {% for message in messages %}
                    <div class="flash-message {{ message.tags }}">
                        <i class="fas 
                            {% if message.tags == 'success' %}fa-check-circle
                            {% elif message.tags == 'error' %}fa-exclamation-circle
                            {% else %}fa-info-circle
                            {% endif %}"></i>
                        {{ message }}
                        <button type="button" class="close"> <i class="fas fa-times"></i></button>
                    </div>
                {% endfor %}
            </div>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <div class="asset-form-grid">
                {% for field in form %}
                    <div class="form-group">
                        <label for="{{ field.id_for_label }}">
                            {{ field.label }}
                            {% if field.field.required %}
                                <span style="color: #ff6b6b;">*</span>
                            {% endif %}
                        </label>
                        {{ field }}
                        {% if field.errors %}
                            <div class="form-error">{{ field.errors }}</div>
                        {% endif %}
                    </div>
                {% endfor %}
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-save"></i> Save
                </button>
                <a href="{% url 'all_access_points' %}" class="btn btn-secondary" style="text-decoration: none;">
                    <i class="fas fa-times"></i> Cancel
                </a>
            </div>
        </form>
    </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        document.querySelectorAll(".flash-message").forEach(function (message) {
            setTimeout(() => message.remove(), 5000);
        });

        document.querySelectorAll(".flash-message .close").forEach(button => {
            button.addEventListener("click", function () {
                this.closest(".flash-message").remove();
            });
        });
    });
</script>
</body>
</html>

{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Edit Screen: {{ screen.serial }}</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" />
</head>
<body>
<div class="container">
    <div class="header">
        <h1 class="title"><i class="fas fa-desktop"></i> Edit Screen: {{ screen.serial }}</h1>
        <a href="javascript:history.back()" class="header-back-btn"><i class="fas fa-arrow-left"></i> Back</a>
    </div>

    <div class="glass-card card-accent-top">
        <h2 class="section-title"><i class="fas fa-info-circle"></i> Screen Details</h2>

        <form action="{% url 'edit_screen' screen.id %}" method="POST" class="form-grid">
            {% csrf_token %}
            {% if messages %}
                <div class="form-group full-width">
                    <div class="validation-message">
                        <ul>
                            {% for message in messages %}
                                <li{% if message.tags %} class="{{ message.tags }}"{% endif %}>{{ message }}</li>
                            {% endfor %}
                        </ul>
                    </div>
                </div>
            {% endif %}

            <div class="form-group">
                <label for="serial">Serial Number</label>
                <input type="text" id="serial" name="serial" value="{{ screen.serial }}" class="form-control" readonly>
            </div>

            <div class="form-group">
                <label for="product">Product</label>
                <select name="product" id="product" class="form-control" required>
                    {% for value, label in screen_product_choices %}
                        <option value="{{ value }}" {% if screen.product == value %}selected{% endif %}>{{ label }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group" id="brandField" >
                <label for="brand">Brand</label>
                <input type="text" id="brand" name="brand" value="{{ screen.brand }}" class="form-control" required>
            </div>

            <div class="form-group" id="statusField">
                <label for="status">Status</label>
                <select name="status" id="status" class="form-control" required onchange="toggleFields()">
                    {% for value, label in screen_status_choices %}
                        <option value="{{ value }}" {% if screen.status == value %}selected{% endif %}>{{ label }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group" id="employeeField">
                <label for="employee">Employee</label>
                <select name="employee" id="employee" class="form-control">
                    <option value="">-- Select Employee --</option>
                    {% for emp in employees %}
                        <option value="{{ emp.id }}" {% if screen.employee and screen.employee.id == emp.id %}selected{% endif %}>
                            {{ emp.name }}
                        </option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group" id="branch_field">
                <label for="branch">Branch</label>
                <select id="branch" name="branch" class="form-control" required>
                    <option value="">-- Select Status --</option>
                    {% for branch in branches %}
                        <option value="{{ branch.id }}" {% if screen.branch.id == branch.id %}selected{% endif %}>
                            {{ branch.name }}
                        </option>
                    {% endfor %}
                </select>
            </div>

            <button type="submit" class="save-button full-width">
                <i class="fas fa-save"></i> Save Changes
            </button>
        </form>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        toggleFields();
    });

    function toggleFields() {
        const status = document.getElementById('status').value;
        const employeeField = document.getElementById('employeeField');
        const employeeInput = document.getElementById('employee');
        const branchfield = document.getElementById('branch_field');   
        if (status === 'In Use') {
            employeeField.style.display = 'block';
            branchfield.style.display = 'block';
            employeeInput.setAttribute('required', 'true');
        } else {
            employeeField.style.display = 'none';
            status.value = 'stock';
            branchfield.style.display = 'none';
            employeeInput.removeAttribute('required');
        }
    }
</script>
</body>
</html>

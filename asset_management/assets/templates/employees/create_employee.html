{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Create Employee</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1 class="title"><i class="fas fa-user-plus"></i> Create New Employee</h1>
            <a href="javascript:history.back()" class="header-back-btn">
                <i class="fas fa-arrow-left"></i> Back
            </a>
        </div>

        <div class="glass-card card-accent-top">
            <h2 class="section-title"><i class="fas fa-id-card"></i> New Employee Form</h2>
            <p class="subtitle">Register a new employee and optionally assign an asset from stock.</p>

            <form method="POST" class="form-grid">
                {% csrf_token %}

                <div class="form-group">
                    <label for="name">Name:</label>
                    <input type="text" id="name" name="name" class="form-control" required>
                </div>

                <div class="form-group">
                    <label for="department">Department:</label>
                    <input type="text" id="department" name="department" class="form-control" required>
                </div>

                <div class="form-group">
                    <label for="title">Title:</label>
                    <input type="text" id="title" name="title" class="form-control" required>
                </div>

                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" class="form-control" required>
                </div>

                <div class="form-group">
                    <label for="branch">Branch:</label>
                    <select id="branch" name="branch" class="form-control" required>
                        <option value="">-- Select Branch --</option>
                        {% for branch in branches %}
                            <option value="{{ branch.id }}"
                                {% if employee.branch.id == branch.id %}selected{% endif %}>
                                {{ branch.name }}
                            </option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-group full-width">
                    <label for="assigned_asset">Assign Asset (optional):</label>
                    <select id="assigned_asset" name="assigned_asset" class="form-control">
                        <option value="">-- Select Asset --</option>
                        {% for asset in assets %}
                            <option value="{{ asset.id }}">{{ asset.product }} - {{ asset.serial }}</option>
                        {% endfor %}
                    </select>
                </div>

                <button type="submit" class="save-button full-width" style="margin-top: 10px;">
                    <i class="fas fa-plus-circle"></i> Create Employee
                </button>
            </form>
        </div>

    </div>
</body>
</html>

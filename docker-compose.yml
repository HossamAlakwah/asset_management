services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: assets
      POSTGRES_USER: assets
      POSTGRES_PASSWORD: assets
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U assets -d assets"]
      interval: 5s
      timeout: 5s
      retries: 12

  web:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      USE_SQLITE: "false"
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: assets
      POSTGRES_USER: assets
      POSTGRES_PASSWORD: assets
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-127.0.0.1,localhost,web}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-http://127.0.0.1:8000,http://localhost:8000}
      TRUST_PROXY_HEADERS: "true"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
